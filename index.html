<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#fbf6ee">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saha & Pratyusha Invite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: playful, teasing, warm — a Telugu family wedding with gym and software jokes
   IDEA: a printed wedding card that quizzes you before it lets you in
   PICTURE: chibi Saha & Pratyusha acting out each joke under a marigold thoranam
   COLOUR and TYPE: ivory white, maroon, marigold, pastel pink; Playfair + Great Vibes + Nunito
   LAYOUT: one card on one screen, picture on top, question and answers below */
:root{color-scheme:only light;
--bg:light-dark(#fbf6ee,#22090f);--card:light-dark(#ffffff,#33121a);--ink:light-dark(#3a1218,#fbefe4);
--soft:light-dark(#7a5a5e,#d9b9b4);--maroon:light-dark(#8c1d2e,#f2a3b0);--btn:#8c1d2e;--gold:#e9a10f;
--pink:light-dark(#fde4ea,#4a1a25);--line:light-dark(#f0dfd6,#4d2530);--scene:light-dark(#fff4e3,#2b0e15)}
:root,:root[data-theme]{color-scheme:only light}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.garland{width:100%;height:46px;flex:none}
main{width:min(460px,100%);padding:4px 14px 28px;flex:1;display:flex;flex-direction:column;justify-content:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:18px 18px 22px;box-shadow:0 18px 40px -24px rgba(110,20,35,.35);position:relative;overflow:hidden}
.tag{font-size:13px;font-weight:800;color:var(--gold);text-align:center;margin:0 0 6px;letter-spacing:.02em}
.dots{display:flex;justify-content:center;gap:6px;margin-bottom:10px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--maroon)}
.scene{width:100%;aspect-ratio:320/220;border-radius:20px;background:var(--scene);display:block}
h1,h2{font-family:"Playfair Display",Georgia,serif;text-align:center;text-wrap:balance;line-height:1.12;margin:16px 4px 14px;color:var(--ink)}
h1{font-size:clamp(30px,8vw,38px)}h2{font-size:clamp(23px,6.2vw,28px)}
h1 em{font-style:normal;color:var(--maroon)}
.yn{position:relative;height:120px}
.yes,.no{font:800 17px Nunito,sans-serif;border-radius:14px;cursor:pointer;min-height:48px;transition:transform .25s}
.yes{background:var(--btn);color:#fff;border:0;padding:0 34px;position:absolute;left:50%;top:8px;transform:translateX(-50%) scale(var(--grow,1));box-shadow:0 8px 18px -8px #8c1d2e}
.no{background:var(--card);color:var(--soft);border:1.5px solid var(--line);padding:0 26px;position:absolute;left:50%;top:68px;transform:translateX(-50%);transition:left .18s,top .18s}
.quip{text-align:center;color:var(--maroon);font-weight:700;min-height:24px;margin:2px 0 0;font-size:15px}
.opts{display:grid;gap:10px}
.opt{font:700 16px/1.3 Nunito,sans-serif;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;min-height:50px;cursor:pointer;text-align:center;transition:background .2s,border-color .2s}
.opt:hover{border-color:var(--maroon)}.opt.pick{background:var(--pink);border-color:var(--maroon)}
.opt:disabled{cursor:default}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.react{text-align:center;font-weight:800;color:var(--maroon);min-height:26px;margin:12px 0 0;opacity:0;transition:opacity .3s}.react.show{opacity:1}
/* final card */
.inv{text-align:center}
.bless{font-size:13px;color:var(--soft);margin:12px 0 0}
.name{font-family:"Great Vibes",cursive;font-size:clamp(34px,9.6vw,44px);color:var(--maroon);line-height:1.05;margin:6px 0 0}
.par{font-size:13.5px;color:var(--soft);margin:2px 0 0;text-wrap:balance}
.weds{font-family:"Playfair Display",serif;font-style:italic;color:var(--gold);font-size:18px;margin:8px 0 2px}
.events{list-style:none;padding:0;margin:18px 0 6px;border-top:1px solid var(--line)}
.events li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:baseline;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line)}
.events .t{font-family:"Playfair Display",serif;font-weight:700;font-size:22px;color:var(--maroon);white-space:nowrap;grid-row:span 2}
.events b{font-size:17px}.events span{font-size:14px;color:var(--soft);white-space:nowrap}
.venue{font-size:14px;color:var(--soft);margin:10px 0 0}
.report{background:var(--pink);border-radius:16px;padding:12px 14px;margin:16px 0 0;text-align:left;font-size:14.5px}
.report h3{font:800 15px Nunito,sans-serif;margin:0 0 6px;color:var(--maroon)}
.report ul{margin:0;padding-left:18px}.report li{margin:2px 0}
.again{margin-top:16px;background:none;border:1.5px solid var(--line);color:var(--soft);font:700 15px Nunito,sans-serif;border-radius:12px;padding:0 18px;min-height:44px;cursor:pointer}
.petal{position:fixed;top:-20px;width:12px;height:12px;border-radius:60% 0 60% 0;pointer-events:none;animation:fall linear forwards;z-index:5}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(540deg)}}
.pop{animation:pop .35s ease}@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.petal{display:none}.pop{animation:none}.no{transition:none}}
.react.nope{color:#c2263a}
.opt.bad{text-decoration:line-through;opacity:.55;border-color:#c2263a;animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.timer{height:4px;border-radius:4px;background:var(--line);margin:10px 18% 0;overflow:hidden;visibility:hidden}.timer i{display:block;height:100%;width:0;background:var(--gold);transition:width 2s linear}
@media(prefers-reduced-motion:reduce){.opt.bad{animation:none}}
.maps{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin:16px 0 0}
.map{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--ink);border:1.5px solid var(--line);border-radius:16px;padding:12px 8px}
.map.wide{grid-column:1/-1;flex-direction:row;gap:14px;text-align:left;padding:12px 14px}.map.wide .qr{width:130px;flex:none;margin:0}.map.wide div{display:flex;flex-direction:column;gap:2px}.map.wide span{white-space:normal}
.map:hover{border-color:var(--maroon)}.map:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.qr{width:100%;max-width:150px;border-radius:8px;border:4px solid #fff;margin-bottom:6px}
.map b{font-size:15px;color:var(--maroon)}.map span{font-size:13px;color:var(--soft);white-space:nowrap}.map em{font-style:normal;font-size:13px;color:var(--gold);font-weight:700}
</style>
</head>
<body>
<svg class="garland" viewBox="0 0 460 46" preserveAspectRatio="none" aria-hidden="true" id="garland"></svg>
<main><div class="card" id="card"></div></main>
<script>
{
const SKIN='#fbe0cc',SKINL='#9a6a52',HAIR='#2a1c16';
const eyes={
 smile:`<ellipse cx="44" cy="64" rx="5.5" ry="7" fill="#2b1a14"/><ellipse cx="76" cy="64" rx="5.5" ry="7" fill="#2b1a14"/><circle cx="46" cy="61" r="2" fill="#fff"/><circle cx="78" cy="61" r="2" fill="#fff"/>`,
 happy:`<path d="M37 66 Q44 57 51 66 M69 66 Q76 57 83 66" stroke="#2b1a14" stroke-width="3" fill="none" stroke-linecap="round"/>`,
 wink:`<ellipse cx="44" cy="64" rx="5.5" ry="7" fill="#2b1a14"/><circle cx="46" cy="61" r="2" fill="#fff"/><path d="M69 66 Q76 58 83 66" stroke="#2b1a14" stroke-width="3" fill="none" stroke-linecap="round"/>`,
 shock:`<circle cx="44" cy="63" r="7" fill="#fff" stroke="#2b1a14" stroke-width="2"/><circle cx="76" cy="63" r="7" fill="#fff" stroke="#2b1a14" stroke-width="2"/><circle cx="44" cy="63" r="2.6" fill="#2b1a14"/><circle cx="76" cy="63" r="2.6" fill="#2b1a14"/>`,
 smug:`<ellipse cx="44" cy="65" rx="5.5" ry="6" fill="#2b1a14"/><ellipse cx="76" cy="65" rx="5.5" ry="6" fill="#2b1a14"/><path d="M37 61 L51 61 M69 61 L83 61" stroke="${SKIN}" stroke-width="5"/><path d="M37 62.5 L51 62.5 M69 62.5 L83 62.5" stroke="#2b1a14" stroke-width="2" stroke-linecap="round"/>`};
const mouths={
 smile:`<path d="M52 82 Q60 90 68 82" stroke="#8a2f3a" stroke-width="2.6" fill="none" stroke-linecap="round"/>`,
 laugh:`<path d="M50 80 Q60 96 70 80 Z" fill="#9b2f3a"/><path d="M54 88 Q60 92 66 88" fill="#f48b9b"/>`,
 shock:`<ellipse cx="60" cy="86" rx="5" ry="6.5" fill="#9b2f3a"/>`,
 smug:`<path d="M53 85 Q62 88 69 80" stroke="#8a2f3a" stroke-width="2.6" fill="none" stroke-linecap="round"/>`};
mouths.happy=mouths.laugh;eyes.laugh=eyes.happy;mouths.wink=mouths.smile;
const outfits={gym:['#2f80ed','#1c5fbf','#ffffff'],
 coat:['#ffffff','#d9d9e4','#8fb7d9'],kurta:['#fff3dc','#e2c48e','#8c1d2e'],
 saree:['#f6a9bd','#e88aa3','#e9a10f'],haldi:['#ffd23f','#e9b500','#f6a9bd'],silk:['#fff6e6','#e2c48e','#8c1d2e'],sareeR:['#b3203a','#8c1d2e','#e9a10f']};
function chibi(who,fit,face,prop){
 const [c1,c2,c3]=outfits[fit];const k=who==='k'||who==='sa';const sa=who==='sa';const armF=fit==='gym'?SKIN:c1,armS=fit==='gym'?SKINL:c2;
 let s='';
 if(!k)s+=`<path d="M16 60 Q10 26 60 17 Q110 26 104 60 Q106 96 112 124 Q104 136 94 126 Q98 110 92 98 L28 98 Q22 110 26 126 Q16 136 8 124 Q14 96 16 60Z" fill="${HAIR}"/>`;
 // body
 s+=`<path d="M32 98 Q60 92 88 98 L96 152 L24 152Z" fill="${c1}" stroke="${c2}" stroke-width="2"/>`;
 if(fit==='coat')s+=`<path d="M50 98 L60 116 L70 98" fill="${k?'#cfe3f5':'#f9c9d5'}" stroke="${c2}" stroke-width="1.5"/><path d="M60 116 L60 152" stroke="${c2}" stroke-width="1.5"/><rect x="70" y="124" width="12" height="9" rx="2" fill="none" stroke="${c2}" stroke-width="1.5"/>`;
 else if(!k)s+=`<path d="M88 98 Q60 120 30 150" stroke="${c3}" stroke-width="7" fill="none" opacity=".9"/><path d="M24 152 L96 152 L96 147 L24 147Z" fill="${c3}"/>`;
 else s+=`<path d="M60 99 L60 140" stroke="${c3}" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/><path d="M48 98 Q60 106 72 98" stroke="${c3}" stroke-width="3" fill="none"/>`;
 // arms + hands
 s+=`<rect x="14" y="102" width="16" height="36" rx="8" fill="${armF}" stroke="${armS}" stroke-width="2" transform="rotate(14 22 104)"/><rect x="90" y="102" width="16" height="36" rx="8" fill="${armF}" stroke="${armS}" stroke-width="2" transform="rotate(-14 98 104)"/>${sa&&prop==='dumbbell'?`<circle cx="20" cy="114" r="10" fill="${armF}" stroke="${armS}" stroke-width="2"/><circle cx="100" cy="114" r="10" fill="${armF}" stroke="${armS}" stroke-width="2"/>`:''}<circle cx="17" cy="138" r="7.5" fill="${SKIN}" stroke="${SKINL}" stroke-width="1.2"/><circle cx="103" cy="138" r="7.5" fill="${SKIN}" stroke="${SKINL}" stroke-width="1.2"/>`;
 s+=`<rect x="40" y="151" width="14" height="13" rx="4" fill="${k?'#3b2a24':'#c9707f'}"/><rect x="66" y="151" width="14" height="13" rx="4" fill="${k?'#3b2a24':'#c9707f'}"/>`;
 // head
 s+=`<circle cx="21" cy="66" r="7" fill="${SKIN}" stroke="${SKINL}" stroke-width="1.2"/><circle cx="99" cy="66" r="7" fill="${SKIN}" stroke="${SKINL}" stroke-width="1.2"/><ellipse cx="60" cy="62" rx="40" ry="38" fill="${SKIN}" stroke="${SKINL}" stroke-width="1.4"/>`;
 s+=`<ellipse cx="34" cy="77" rx="7" ry="4" fill="#f7a1a8" opacity=".55"/><ellipse cx="86" cy="77" rx="7" ry="4" fill="#f7a1a8" opacity=".55"/>`;
 s+=eyes[face]+mouths[face];
 if(sa){
  s+=`<path d="M47 79.5 Q54 75.5 60 78 Q66 75.5 73 79.5 Q66 81 60 80 Q54 81 47 79.5Z" fill="${HAIR}"/>`;
  s+=`<path d="M19 60 Q15 20 60 15 Q105 20 101 60 Q99 40 88 33 Q70 28 52 34 Q34 30 26 40 Q21 48 19 60Z" fill="${HAIR}"/><path d="M36 26 Q58 2 90 22 Q70 16 52 30Z" fill="${HAIR}"/>`;
 }else if(k){
  s+=`<path d="M21 66 Q22 99 60 103 Q98 99 99 66 Q94 90 76 92 Q68 95 60 95 Q52 95 44 92 Q26 90 21 66Z" fill="${HAIR}" opacity=".88"/><path d="M47 79 Q54 74 60 77.5 Q66 74 73 79 Q66 81.5 60 80 Q54 81.5 47 79Z" fill="${HAIR}"/>`;
  s+=`<path d="M18 62 Q14 22 60 18 Q106 22 102 62 Q97 42 82 37 Q62 46 40 37 Q24 43 18 62Z M22 42 L17 21 L34 29 L37 8 L50 23 L61 2 L69 21 L85 8 L85 27 L102 19 L99 44Z" fill="${HAIR}"/>`;
 }else if(who==='p'){
  s+=`<path d="M60 22 Q24 22 19 70 Q30 36 74 30 Q70 24 60 22Z M64 23 Q96 24 101 70 Q92 42 70 29Z" fill="${HAIR}"/><circle cx="60" cy="44" r="2.6" fill="#c2263a"/>`;
  s+=`<circle cx="99" cy="76" r="3" fill="#e9a10f"/>`+[[100,32],[106,40],[108,50],[103,26]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.6" fill="#fff" stroke="#e7e2d8"/>`).join('');
 }else{
  s+=`<path d="M60 23 Q26 24 19 70 Q30 42 60 31Z M60 23 Q94 24 101 70 Q90 42 60 31Z" fill="${HAIR}"/><path d="M60 22 L60 31" stroke="#c2263a" stroke-width="2"/><circle cx="60" cy="44" r="2.6" fill="#c2263a"/>`;
  s+=`<circle cx="99" cy="76" r="3" fill="#e9a10f"/>`;
 }
 if(fit==='haldi')s+=`<circle cx="34" cy="74" r="5" fill="#f2b705" opacity=".85"/><circle cx="84" cy="72" r="6" fill="#f2b705" opacity=".85"/><circle cx="60" cy="40" r="4" fill="#f2b705" opacity=".8"/>`;
 if(prop==='steth')s+=`<path d="M45 99 Q48 124 60 124 Q72 124 75 99" stroke="#4a5568" stroke-width="2.6" fill="none"/><path d="M60 124 L60 134" stroke="#4a5568" stroke-width="2.6"/><circle cx="60" cy="138" r="5" fill="#cbd5e0" stroke="#4a5568" stroke-width="2"/>`;
 if(prop==='gift')s+=`<rect x="30" y="118" width="60" height="38" rx="4" fill="#8c1d2e"/><rect x="56" y="118" width="8" height="38" fill="#e9a10f"/><rect x="30" y="132" width="60" height="7" fill="#e9a10f"/><path d="M60 118 Q46 104 50 116 Q54 120 60 118 Q74 104 70 116 Q66 120 60 118" fill="#e9a10f"/><circle cx="25" cy="132" r="7.5" fill="${SKIN}" stroke="${SKINL}"/><circle cx="95" cy="132" r="7.5" fill="${SKIN}" stroke="${SKINL}"/>`;
 if(prop==='dumbbell')s+=`<rect x="90" y="135" width="30" height="6" rx="3" fill="#6b7280"/><rect x="86" y="126" width="8" height="24" rx="2" fill="#374151"/><rect x="116" y="126" width="8" height="24" rx="2" fill="#374151"/>`;
 if(prop==='laptop')s+=`<rect x="30" y="116" width="60" height="38" rx="4" fill="#d6dee8" stroke="#5b6b7d" stroke-width="2"/><circle cx="60" cy="135" r="4" fill="#fff"/><circle cx="25" cy="132" r="7.5" fill="${SKIN}" stroke="${SKINL}"/><circle cx="95" cy="132" r="7.5" fill="${SKIN}" stroke="${SKINL}"/>`;
 if(prop==='whey')s+=`<rect x="92" y="108" width="28" height="36" rx="6" fill="#2b2b2b"/><rect x="92" y="104" width="28" height="9" rx="3" fill="#e9a10f"/><text x="106" y="131" font-size="8" fill="#fff" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="800">WHEY</text>`;
 if(prop==='bowl')s+=`<path d="M34 128 L86 128 Q84 152 60 152 Q36 152 34 128Z" fill="#c98a1b"/><ellipse cx="60" cy="128" rx="26" ry="6" fill="#ffc21a"/>`;
 return s;
}
const at=(x,y,sc,inner,flip)=>`<g transform="translate(${x} ${y}) scale(${flip?-sc:sc} ${sc})${flip?' translate(-120 0)':''}">${inner}</g>`;
const floor=`<ellipse cx="160" cy="206" rx="130" ry="10" fill="#8c1d2e" opacity=".08"/>`;
const sparkle=(x,y,c='#e9a10f')=>`<path d="M${x} ${y-7} L${x+2} ${y-2} L${x+7} ${y} L${x+2} ${y+2} L${x} ${y+7} L${x-2} ${y+2} L${x-7} ${y} L${x-2} ${y-2}Z" fill="${c}"/>`;
const heart=(x,y,s=1,c='#e0445d')=>`<path transform="translate(${x} ${y}) scale(${s})" d="M0 6 C-10 -4 -18 4 0 16 C18 4 10 -4 0 6Z" fill="${c}"/>`;
const scenes={
 intro:floor+`<circle cx="160" cy="112" r="88" fill="#ffe7b0" opacity=".55"/>`+heart(160,14,1.3)+sparkle(40,50)+sparkle(280,46)+at(58,40,1,chibi('sa','kurta','wink'))+at(150,40,1,chibi('p','saree','smile')),
 haldi:floor+`<circle cx="160" cy="110" r="92" fill="#ffd23f" opacity=".35"/>`+[[40,40],[280,52],[70,150],[250,150],[160,26]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="6" fill="#f2b705"/>`).join('')+at(52,40,1,chibi('sa','haldi','laugh'))+at(150,40,1,chibi('p','haldi','laugh','bowl')),
 gym:floor+`<rect x="14" y="150" width="70" height="8" rx="3" fill="#9ca3af"/>`+[24,44,64].map(x=>`<rect x="${x}" y="126" width="10" height="24" rx="2" fill="#374151"/>`).join('')+`<text x="250" y="44" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="800" font-size="15" fill="#2f80ed">NO DAYS OFF</text>`+at(76,40,1,chibi('sa','gym','smug','dumbbell'))+at(186,54,.9,chibi('p','sareeR','shock')),
 clock:floor+`<circle cx="160" cy="62" r="38" fill="#fff" stroke="#8c1d2e" stroke-width="4"/>${[...Array(12)].map((_,i)=>`<circle cx="${160+31*Math.sin(i*Math.PI/6)}" cy="${62-31*Math.cos(i*Math.PI/6)}" r="2" fill="#8c1d2e"/>`).join('')}<path d="M160 62 L148.9 76.2" stroke="#3a1218" stroke-width="4" stroke-linecap="round"/><path d="M160 62 L186.9 64.8" stroke="#e9a10f" stroke-width="3" stroke-linecap="round"/><circle cx="160" cy="62" r="3.5" fill="#3a1218"/><text x="160" y="122" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="800" font-size="15" fill="#8c1d2e">7:16 PM</text>`+at(6,54,.92,chibi('sa','kurta','shock'))+at(204,54,.92,chibi('p','saree','smug')),
 gift:floor+sparkle(40,40)+sparkle(280,60)+sparkle(250,30,'#e0445d')+at(52,40,1,chibi('sa','kurta','wink'))+at(152,40,1,chibi('p','saree','happy','gift')),
 advice:floor+`<g transform="translate(160 44)"><rect x="-26" y="-18" width="52" height="32" rx="4" fill="#d6dee8" stroke="#5b6b7d" stroke-width="2"/><rect x="-32" y="14" width="64" height="6" rx="3" fill="#5b6b7d"/><circle r="30" fill="none" stroke="#c2263a" stroke-width="5"/><path d="M-21 -21 L21 21" stroke="#c2263a" stroke-width="5"/></g>`+heart(48,40,.9)+heart(272,40,.9)+at(46,54,.92,chibi('sa','kurta','smile'))+at(164,54,.92,chibi('p','saree','laugh')),
 recep:floor+`<circle cx="160" cy="110" r="90" fill="#ffe0c4" opacity=".6"/><g transform="translate(160 40) rotate(-25)"><ellipse cx="0" cy="0" rx="16" ry="12" fill="#b5651d"/><ellipse cx="-4" cy="-3" rx="7" ry="4" fill="#d98b3a"/><rect x="12" y="-3" width="18" height="6" rx="3" fill="#fff3e0"/><circle cx="30" cy="-4" r="4" fill="#fff3e0"/><circle cx="30" cy="4" r="4" fill="#fff3e0"/></g>`+sparkle(60,50)+sparkle(262,44)+at(52,44,1,chibi('sa','kurta','laugh'))+at(150,44,1,chibi('p','sareeR','happy'))+`<ellipse cx="160" cy="190" rx="46" ry="9" fill="#fff" stroke="#c9c2b8" stroke-width="2"/><ellipse cx="148" cy="185" rx="12" ry="6" fill="#c25a1b"/><ellipse cx="172" cy="186" rx="11" ry="5" fill="#f2c14e"/>`,
 final:floor+`<path d="M40 210 L40 70 Q40 22 160 18 Q280 22 280 70 L280 210" fill="none" stroke="#e9a10f" stroke-width="6"/><path d="M52 210 L52 74 Q52 34 160 30 Q268 34 268 74 L268 210" fill="none" stroke="#8c1d2e" stroke-width="2.5"/>`+[...Array(9)].map((_,i)=>`<circle cx="${72+i*22}" cy="${44+Math.abs(4-i)*3}" r="6" fill="${i%2?'#e9a10f':'#f47c20'}"/>`).join('')+heart(160,70,1.1)+at(70,66,.88,chibi('sa','silk','happy'))+at(148,66,.88,chibi('p','sareeR','happy'))};
const svg=k=>`<svg class="scene" viewBox="0 0 320 220" role="img" aria-label="Chibi Saha and Pratyusha">${scenes[k]}</svg>`;

const Q=[
 {scene:'haldi',q:'Haldi is on the morning of 29 December. What’s your role?',o:[

const card=document.getElementById('card');
let picks=[],wrong=0;
const dots=n=>`<div class="dots">${Q.map((_,i)=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div>`;

function intro(){
 picks=[];wrong=0;
 card.innerHTML=`<div class="pop">${svg('intro')}<h1>Want to come to <em>our wedding?</em> 💍</h1>
 <div class="yn" id="yn"><button class="yes" id="yes">YES</button><button class="no" id="no">NO</button></div><p class="quip" id="quip" aria-live="polite"></p></div>`;
 const no=document.getElementById('no'),yes=document.getElementById('yes'),yn=document.getElementById('yn'),quip=document.getElementById('quip');
 const lines=['Wrong button. Try again.','Are you sure? Think again.','Error 404: NO button not found.','That button is out of order.','Just press YES 😄'];
 let n=0;
 const run=e=>{if(e){e.preventDefault()}
  const W=yn.clientWidth-no.offsetWidth,H=yn.clientHeight-no.offsetHeight;
  let x,y;do{x=Math.random()*W;y=Math.random()*H}while(Math.abs(x-(W/2))<70&&y<60);
  no.style.left=x+'px';no.style.top=y+'px';no.style.transform='none';
  quip.textContent=lines[n%lines.length];n++;
  yes.style.setProperty('--grow',Math.min(1+n*.12,1.7));};
 no.addEventListener('pointerenter',run);no.addEventListener('pointerdown',run);
 no.addEventListener('click',e=>{run(e)});
 yes.addEventListener('click',()=>ask(0));
}
function ask(i){
 const d=Q[i];
 card.innerHTML=`<div class="pop"><p class="tag">Question ${i+1} of ${Q.length}</p>${dots(i)}${svg(d.scene)}<h2>${d.q}</h2>
 <div class="opts">${d.o.map((o,j)=>`<button class="opt" data-j="${j}">${o[0]}</button>`).join('')}</div><p class="react" id="react" aria-live="polite"></p><div class="timer"><i id="bar"></i></div></div>`;
 const r=document.getElementById('react');
 card.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
  const j=+b.dataset.j,o=d.o[j];
  r.textContent=o[1];r.classList.remove('show','nope');void r.offsetWidth;r.classList.add('show');
  if(o[2]){wrong++;b.classList.add('bad');b.disabled=true;r.classList.add('nope');return}
  picks[i]=o[0];
  card.querySelectorAll('.opt').forEach(x=>x.disabled=true);b.classList.add('pick');
  const bar=document.getElementById('bar');bar.parentNode.style.visibility='visible';requestAnimationFrame(()=>bar.style.width='100%');
  setTimeout(()=>i+1<Q.length?ask(i+1):finale(),2000);}));
}
